name: Build

# Builds MathiSynth on Windows and macOS for every push, then publishes the zips as a GitHub Release
# (release v<version from CMakeLists.txt> for pushes to main, or the tag name for pushed v* tags).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build -A x64   # newest installed Visual Studio
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        shell: bash
        run: |
          TARGETS="MathiSynth_VST3 MathiSynth_Standalone MathiSynthTests"
          if [ "$RUNNER_OS" == "macOS" ]; then TARGETS="$TARGETS MathiSynth_AU"; fi
          cmake --build build --config Release --parallel 4 --target $TARGETS

      - name: Render test (all presets)
        shell: bash
        run: ./build/MathiSynthTests_artefacts/Release/MathiSynthTests

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/MathiSynth_artefacts/Release/VST3/MathiSynth.vst3 dist/
          Copy-Item build/MathiSynth_artefacts/Release/Standalone/MathiSynth.exe dist/
          Compress-Archive -Path dist/* -DestinationPath MathiSynth-Windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R build/MathiSynth_artefacts/Release/VST3/MathiSynth.vst3 dist/
          cp -R build/MathiSynth_artefacts/Release/AU/MathiSynth.component dist/
          cp -R build/MathiSynth_artefacts/Release/Standalone/MathiSynth.app dist/
          (cd dist && ditto -c -k --keepParent . ../MathiSynth-macOS.zip)

      - name: Build macOS installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          # Files placed by Installer aren't quarantined, so no Terminal step is needed afterwards.
          VERSION=$(grep -oE 'project\(MathiSynth VERSION [0-9.]+' CMakeLists.txt | awk '{print $3}')
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Applications"
          cp -R build/MathiSynth_artefacts/Release/VST3/MathiSynth.vst3 "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R build/MathiSynth_artefacts/Release/AU/MathiSynth.component "$ROOT/Library/Audio/Plug-Ins/Components/"
          cp -R build/MathiSynth_artefacts/Release/Standalone/MathiSynth.app "$ROOT/Applications/"
          pkgbuild --root "$ROOT" --identifier com.mathiaudio.mathisynth.pkg --version "$VERSION" \
                   --install-location / MathiSynth-macOS-Installer.pkg
          pkgutil --payload-files MathiSynth-macOS-Installer.pkg | grep -E 'vst3$|component$|app$'

      - uses: actions/upload-artifact@v4
        with:
          name: MathiSynth-${{ matrix.name }}
          path: |
            MathiSynth-${{ matrix.name }}.zip
            MathiSynth-macOS-Installer.pkg
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Work out release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -oP 'project\(MathiSynth VERSION \K[0-9.]+' CMakeLists.txt)
            echo "name=v${v}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: MathiSynth ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            MathiSynth-Windows.zip
            MathiSynth-macOS-Installer.pkg
            MathiSynth-macOS.zip
          body: |
            **Windows (FL Studio / Ableton):** unzip `MathiSynth-Windows.zip` and copy the `MathiSynth.vst3` folder into `C:\Program Files\Common Files\VST3\`, then rescan plugins.
            **macOS (easiest):** download `MathiSynth-macOS-Installer.pkg`, then right-click it → **Open** (needed once because the installer isn't signed by Apple) and follow the steps. It installs the VST3 and AU plugins for every DAW, plus the standalone app in Applications. Rescan plugins in FL Studio / Ableton afterwards.
            **macOS (manual):** unzip `MathiSynth-macOS.zip`, copy `MathiSynth.vst3` to `~/Library/Audio/Plug-Ins/VST3/` (and `MathiSynth.component` to `~/Library/Audio/Plug-Ins/Components/` for AU), then run `xattr -dr com.apple.quarantine` on them because the build is unsigned.
